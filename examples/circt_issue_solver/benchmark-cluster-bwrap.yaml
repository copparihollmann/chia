# Deterministic bwrap arm for isolation_benchmark.py. The rootfs was exported
# once from the exact image used by benchmark-cluster-docker.yaml, outside every
# timed trial.
cluster_name: circt_isolation_benchmark
provider:
    head_ip: ${CHIA_HEAD}
auth:
    ssh_user: ${USER}
available_node_types:
    circt_worker:
        resources: {"circt": 1}
        num_workers: 1
        compatible_ips: ["${CHIA_HEAD}"]
        bwrap:
            rootfs: /scratch/agustin/projects/chia-experiments/shared/circt-rootfs
            worker_name: "circt_isolation_bwrap_${USER}"
            state_dir: /scratch/agustin/tmp/r/state
            working_dir: /workspace
            read_write_binds:
                /scratch/agustin/projects/chia-experiments/bwrap/bwrap/workspace: /workspace
                /scratch/agustin/projects/chia-experiments/bwrap/bwrap/home-ray: /home/ray
                /scratch/agustin/tmp/r/bwrap-ray: /scratch/agustin/tmp/r/head
            environment:
                HOME: /home/ray
                CCACHE_DISABLE: "1"
                PATH: /home/ray/anaconda3/envs/py_worker/bin:/workspace/circt/build/bin:/opt/circt-sdk/bin:/usr/lib/ccache:/opt/sbt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                LD_LIBRARY_PATH: /opt/circt-sdk/lib
                CC: clang
                CXX: clang++
            run_setup_commands:
                - git config --global --add safe.directory /workspace/circt || true
head_env_commands:
    - "source /scratch2/agustin/miniforge3/etc/profile.d/conda.sh && conda activate chia_matrix"
head_start_ray_commands:
    - "source /scratch2/agustin/miniforge3/etc/profile.d/conda.sh && conda activate chia_matrix && RAY_TMPDIR=/scratch/agustin/tmp/r/head ray start --head --port=46379 --include-dashboard=False"
worker_start_ray_commands:
    - ray stop
    - RAY_TMPDIR=/scratch/agustin/tmp/r/head ray start --address=$RAY_HEAD_IP:46379 --dashboard-agent-listen-port=0
